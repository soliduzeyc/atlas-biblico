<html lang="es">
<head>

<title>Límite Judá–Benjamín · Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root{
  --iron:#232A28; --paper:#E4E3DB; --paper-2:#D9D8CE; --line:#B9B8AC;
  --olive:#5F7248; --ochre:#B0813C; --ash:#8A8C85; --sea:#3E6572;
  --ink-2:#4A524F;
  --f-disp:"Instrument Serif",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--iron);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%}

/* ---- header ---- */
.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
     padding:12px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.hdr h1{font-family:var(--f-disp);font-size:26px;font-weight:400;letter-spacing:.01em;line-height:1}
.hdr .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tally{margin-left:auto;display:flex;gap:12px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.tally b{color:var(--iron);font-weight:500}

/* ---- shell ---- */
.shell{flex:1;display:flex;min-height:0}
#map{flex:1;min-height:0;background:var(--paper-2)}

/* ---- rail ---- */
.rail{width:326px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--line);
      background:var(--paper);-webkit-overflow-scrolling:touch}
.ctrls{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.ctrls label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.ctrls input{accent-color:var(--olive);width:14px;height:14px;cursor:pointer}

.tramo{padding:14px 16px 5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;
       text-transform:uppercase;color:var(--ink-2);border-top:1px solid var(--line);margin-top:2px}
.tramo:first-of-type{border-top:none}
.tramo em{font-style:normal;color:var(--ash)}

.row{display:grid;grid-template-columns:26px 20px 1fr;gap:8px;align-items:baseline;
     padding:6px 16px;cursor:pointer;border-left:2px solid transparent}
.row:hover{background:var(--paper-2)}
.row.on{background:var(--paper-2);border-left-color:var(--iron)}
.row .n{font-family:var(--f-mono);font-size:10px;color:var(--ash)}
.row .sg{font-size:13px;line-height:1.2}
.row .nm{font-size:14px;line-height:1.3}
.row .id{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.row.dim{opacity:.45}

/* sigla colours by confianza */
.c-alta{color:var(--olive)} .c-media{color:var(--ochre)} .c-baja{color:var(--ash)}

/* ---- legend ---- */
.leg{padding:14px 16px 26px;border-top:1px solid var(--line);margin-top:10px}
.leg h2{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--ink-2);font-weight:500;margin-bottom:8px}
.leg dl{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.leg dt{text-align:center}
.leg .swatch{display:inline-block;width:22px;height:3px;vertical-align:middle}

/* ---- popup ---- */
.leaflet-popup-content-wrapper{border-radius:2px;background:var(--paper);
  box-shadow:0 2px 14px rgba(35,42,40,.22);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;width:262px!important;font-family:var(--f-body);font-size:13px;line-height:1.45}
.leaflet-popup-tip{background:var(--paper);border:1px solid var(--line)}
.zone-tip{background:var(--iron);color:var(--paper);border:none;font-family:var(--f-mono);
  font-size:10.5px;padding:3px 7px;border-radius:1px}
.zone-tip::before{border-top-color:var(--iron)}
.pop h3{font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.1;margin-bottom:2px}
.pop .ident{font-size:12.5px;color:var(--ink-2);margin-bottom:9px}
.pop .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pop .tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
          padding:2px 6px;border:1px solid var(--line);color:var(--ink-2)}
.pop .tag.hi{border-color:var(--olive);color:var(--olive)}
.pop .tag.md{border-color:var(--ochre);color:var(--ochre)}
.pop dl.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:11.5px;margin-bottom:9px}
.pop dl.meta dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ash);padding-top:1px}
.pop .note{font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;line-height:1.45}
.pop .warn{font-size:12px;background:var(--paper-2);border-left:2px solid var(--ochre);
           padding:7px 9px;margin-top:8px;line-height:1.4}
.pop .alias{font-family:var(--f-mono);font-size:10.5px;color:var(--ash);margin-top:7px;line-height:1.5}

/* ---- inline markers ---- */
.wrap{position:relative;display:flex;align-items:center;justify-content:center}
.mk{display:block;border-radius:50%}
.dan{position:absolute;top:0;left:0;border-radius:50%;pointer-events:none}
.pop .tag.dan{border-color:var(--sea);color:var(--sea)}
.pop .dan-note{font-size:12px;background:var(--paper-2);border-left:2px solid var(--sea);
  padding:7px 9px;margin-top:8px;line-height:1.45}
.halo{border-radius:50%;pointer-events:none}

@media(max-width:820px){
  .shell{flex-direction:column-reverse}
  .rail{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:44vh}
  #map{min-height:56vh}
  .hdr h1{font-size:22px}
  .tally{width:100%;margin-left:0;order:3}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const F = DATA.features.slice().sort((a,b)=>a.properties.orden-b.properties.orden);
const byId = Object.fromEntries(F.map(f=>[f.properties.id,f]));
const CONF = {alta:'#5F7248', media:'#B0813C', baja:'#8A8C85'};
const SIG  = {verificada:'●', provisional:'◍', pendiente:'○', no_aplica:'▤'};

/* interpolación por secuencia: sólo para pendientes sin geometría */
function anchorsFor(i){
  let a=null,b=null;
  for(let k=i-1;k>=0;k--) if(F[k].geometry){a=F[k];break;}
  for(let k=i+1;k<F.length;k++) if(F[k].geometry){b=F[k];break;}
  return [a,b];
}
function haversineKm(p,q){
  const R=6371,dLat=(q[1]-p[1])*Math.PI/180,dLon=(q[0]-p[0])*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(p[1]*Math.PI/180)*Math.cos(q[1]*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const POS = {};   // id -> {lat,lng,inferida,haloM}
F.forEach((f,i)=>{
  const p=f.properties;
  if(p.render==='zona') return;                       // las zonas no se dibujan
  if(f.geometry){
    POS[p.id]={lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],inferida:false,haloM:0};
    return;
  }
  const [a,b]=anchorsFor(i);
  if(!a||!b) return;                                   // sin anclaje por ambos lados: sólo lista
  const t=(p.orden-a.properties.orden)/(b.properties.orden-a.properties.orden);
  const A=a.geometry.coordinates, B=b.geometry.coordinates;
  POS[p.id]={
    lat:A[1]+(B[1]-A[1])*t, lng:A[0]+(B[0]-A[0])*t,
    inferida:true, haloM:haversineKm(A,B)*1000*0.35
  };
});

/* ---------- mapa ---------- */
const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([31.79,35.12],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap · CARTO', subdomains:'abcd', maxZoom:18
}).addTo(map);

const layerZone=L.layerGroup().addTo(map);
const layerHalo=L.layerGroup().addTo(map);
const layerLine=L.layerGroup().addTo(map);
const layerMark=L.layerGroup().addTo(map);

/* la línea: su textura ES la confianza */
function segStyle(a,b){
  const rank=x=>x==='verificada'?0:x==='provisional'?1:2;
  const w=Math.max(rank(a.coordenada_estado),rank(b.coordenada_estado));
  if(w===0) return {color:'#232A28',weight:2.4,opacity:.85};
  if(w===1) return {color:'#232A28',weight:2,opacity:.6,dashArray:'9 5'};
  return {color:'#8A8C85',weight:1.6,opacity:.55,dashArray:'1 6',lineCap:'round'};
}
function drawZones(){
  layerZone.clearLayers();
  F.forEach(f=>{
    const p=f.properties;
    if(p.render!=='zona'||!f.geometry) return;
    const verified=p.coordenada_estado==='verificada';
    const coords=f.geometry.coordinates.map(c=>[c[1],c[0]]);
    const ln=L.polyline(coords,{
      color:'#3E6572', weight:verified?3:2, opacity:verified?.6:.42,
      dashArray:verified?null:'2 7', lineCap:'round'
    }).addTo(layerZone);
    ln.bindTooltip(p.nombre,{sticky:true,className:'zone-tip'});
    ln.on('click',()=>{
      L.popup({maxWidth:290}).setLatLng(coords[Math.floor(coords.length/2)])
        .setContent(popupHTML(p)).openOn(map);
    });
  });
}
function drawLine(){
  layerLine.clearLayers();
  const pts=F.filter(f=>POS[f.properties.id]);
  for(let i=0;i<pts.length-1;i++){
    const A=POS[pts[i].properties.id], B=POS[pts[i+1].properties.id];
    L.polyline([[A.lat,A.lng],[B.lat,B.lng]],
      segStyle(pts[i].properties,pts[i+1].properties)).addTo(layerLine);
  }
}

function popupHTML(p){
  const est={verificada:'Verificada',provisional:'Provisional',pendiente:'Posición inferida'}[p.coordenada_estado];
  const cls=p.confianza==='alta'?'hi':p.confianza==='media'?'md':'';
  let h=`<div class="pop"><h3>${p.nombre}</h3>`;
  h+=`<div class="ident">${p.identificacion||'Sin identificación propuesta'}</div>`;
  h+=`<div class="tags"><span class="tag ${cls}">Confianza ${p.confianza}</span>`
    +`<span class="tag">${est}</span>`
    +(p.precision?`<span class="tag">${p.precision}</span>`:'')
    +(p.tribu_posterior?`<span class="tag dan">Después: Dan</span>`:'')+`</div>`;
  h+=`<dl class="meta"><dt>Texto</dt><dd>${p.referencias.join(' · ')}</dd>`;
  h+=`<dt>Tribu</dt><dd>${p.pertenece_a.map(x=>x==='juda'?'Judá':'Benjamín').join(' y ')}</dd>`;
  if(p.fuente) h+=`<dt>Fuente</dt><dd>${p.fuente}</dd>`;
  h+=`</dl>`;
  if(p.coordenada_estado==='pendiente'&&POS[p.id])
    h+=`<div class="note"><strong>Esta posición no es un dato.</strong> Se ha deducido de la secuencia del texto entre los dos puntos conocidos más cercanos. El halo indica cuánto margen hay.</div>`;
  else if(p.nota) h+=`<div class="note">${p.nota}</div>`;
  if(p.tribu_posterior){
    const tp=p.tribu_posterior, lbl={nombrado:'Nombrada en el texto',probable:'Identificación probable',solo_cartografico:'Solo en el mapa, no en el texto'}[tp.certeza];
    h+=`<div class="dan-note"><strong>Reasignada a Dan</strong> · ${lbl}${tp.referencia?' · '+tp.referencia:''}<br>${tp.nota}</div>`;
  }
  if(p.advertencia) h+=`<div class="warn">${p.advertencia}</div>`;
  if(p.aliases&&p.aliases.length)
    h+=`<div class="alias">También: ${p.aliases.map(a=>a.forma).join(' · ')}</div>`;
  return h+`</div>`;
}

const marks={};
let showDan=false;
function drawMarks(showInf){
  layerMark.clearLayers(); layerHalo.clearLayers();
  F.forEach(f=>{
    const p=f.properties, q=POS[p.id];
    if(!q) return;
    if(q.inferida&&!showInf) return;
    const col=CONF[p.confianza];
    if(q.inferida&&q.haloM>0)
      L.circle([q.lat,q.lng],{radius:q.haloM,color:col,weight:1,opacity:.3,
        fillColor:col,fillOpacity:.06,dashArray:'2 4',className:'halo'}).addTo(layerHalo);
    const solid=p.coordenada_estado==='verificada';
    const dash =p.coordenada_estado==='pendiente';
    const r=solid?7:11;
    const dan=showDan&&p.tribu_posterior;
    const R=dan?r+5:r;
    const ring=dan?`<span class="dan" style="width:${R*2}px;height:${R*2}px;
        border:1.5px ${p.tribu_posterior.certeza==='nombrado'?'solid':'dashed'} #3E6572"></span>`:'';
    const icon=L.divIcon({className:'',iconSize:[R*2,R*2],iconAnchor:[R,R],
      html:`<span class="wrap" style="width:${R*2}px;height:${R*2}px">${ring}<span class="mk" style="width:${r*2}px;height:${r*2}px;
        background:${solid?col:'transparent'};
        border:${solid?'2px solid #E4E3DB':(dash?'1.5px dashed ':'2px solid ')+col};
        box-shadow:${solid?'0 0 0 1px '+col:'none'}"></span></span>`});
    const m=L.marker([q.lat,q.lng],{icon,riseOnHover:true})
      .bindPopup(popupHTML(p),{maxWidth:290,closeButton:true}).addTo(layerMark);
    m.on('click',()=>select(p.id,false));
    marks[p.id]=m;
  });
}

/* ---------- panel ---------- */
const TR={1:['Tramo 1','Mar Salado → En-Roguel'],2:['Tramo 2','Jerusalén'],3:['Tramo 3','Quiryat-Jearim → el mar']};
function buildRail(){
  const r=document.getElementById('rail');
  let h=`<div class="ctrls">
    <label><input type="checkbox" id="tInf" checked> Mostrar posiciones inferidas</label>
    <label><input type="checkbox" id="tLine" checked> Mostrar el trazado de la frontera</label>
    <label><input type="checkbox" id="tDan"> Marcar lo que después pasó a Dan</label>
    <label><input type="checkbox" id="tZone" checked> Mostrar valles y regiones</label>
  </div>`;
  [1,2,3].forEach(t=>{
    h+=`<div class="tramo">${TR[t][0]} <em>· ${TR[t][1]}</em></div>`;
    F.filter(f=>f.properties.tramo===t).forEach(f=>{
      const p=f.properties, q=POS[p.id];
      const sg=p.render==='zona'?SIG.no_aplica:SIG[p.coordenada_estado];
      const isZoneDrawn=p.render==='zona'&&f.geometry;
      const dim=!q&&!isZoneDrawn;
      h+=`<div class="row${dim?' dim':''}" data-id="${p.id}">
        <span class="n">${String(p.orden).padStart(2,'0')}</span>
        <span class="sg c-${p.confianza}">${sg}</span>
        <span><span class="nm">${p.nombre}</span>
        <span class="id">${p.render==='zona'?(isZoneDrawn?'Zona · trazada':'Zona · sin trazar todavía'):(p.identificacion||'sin identificación')}</span></span>
      </div>`;
    });
  });
  h+=`<div class="leg"><h2>Cómo leer el mapa</h2>
    <dl>
      <dt style="color:var(--olive)">●</dt><dd>Coordenada verificada con fuente</dd>
      <dt style="color:var(--olive)">◍</dt><dd>Provisional: sin fuente confirmada, pero coherente</dd>
      <dt style="color:var(--ash)">○</dt><dd>Posición deducida de la secuencia del texto</dd>
      <dt style="color:var(--ash)">▤</dt><dd>Zona: valle o rasgo sin polígono todavía</dd>
    </dl>
    <h2>El color dice qué tan segura es la identificación</h2>
    <dl>
      <dt style="color:var(--olive)">●</dt><dd>Alta</dd>
      <dt style="color:var(--ochre)">●</dt><dd>Media</dd>
      <dt style="color:var(--ash)">●</dt><dd>Discutida o desconocida</dd>
    </dl>
    <h2>La línea también informa</h2>
    <dl>
      <dt><span class="swatch" style="background:#232A28;height:3px"></span></dt><dd>Entre dos puntos verificados</dd>
      <dt><span class="swatch" style="background:repeating-linear-gradient(90deg,#232A28 0 6px,transparent 6px 10px);height:2px"></span></dt><dd>Toca un punto provisional</dd>
      <dt><span class="swatch" style="background:repeating-linear-gradient(90deg,#8A8C85 0 2px,transparent 2px 6px);height:2px"></span></dt><dd>Cruza un tramo deducido</dd>
    </dl>
    <div id="danLeg" style="display:none">
    <h2>El anillo azul: territorio que pasó a Dan</h2>
    <dl>
      <dt style="color:var(--sea)">◎</dt><dd>Anillo continuo: la ciudad se nombra en Josué 19:41-46</dd>
      <dt style="color:var(--sea)">◌</dt><dd>Anillo discontinuo: identificación probable, o solo sombreada en el mapa B6</dd>
    </dl>
    <p style="font-size:12px;color:var(--ink-2);line-height:1.45">El límite norte de Judá en el Tramo 3 atraviesa ciudades que después se adjudicaron a Dan. Dan no logró retenerlas y emigró al norte (Jos 19:47).</p>
    </div></div>`;
  r.innerHTML=h;
  r.querySelectorAll('.row').forEach(el=>el.addEventListener('click',()=>select(el.dataset.id,true)));
  document.getElementById('tInf').addEventListener('change',e=>{drawMarks(e.target.checked)});
  document.getElementById('tLine').addEventListener('change',e=>{
    e.target.checked?layerLine.addTo(map):map.removeLayer(layerLine)});
  document.getElementById('tZone').addEventListener('change',e=>{
    e.target.checked?layerZone.addTo(map):map.removeLayer(layerZone)});
  document.getElementById('tDan').addEventListener('change',e=>{
    showDan=e.target.checked;
    document.getElementById('danLeg').style.display=showDan?'block':'none';
    drawMarks(document.getElementById('tInf').checked)});
}
function select(id,fly){
  document.querySelectorAll('.row').forEach(el=>el.classList.toggle('on',el.dataset.id===id));
  const f=byId[id];
  if(f&&f.properties.render==='zona'&&f.geometry){
    const coords=f.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(fly) map.flyToBounds(L.latLngBounds(coords),{padding:[60,60],duration:.6});
    L.popup({maxWidth:290}).setLatLng(coords[Math.floor(coords.length/2)])
      .setContent(popupHTML(f.properties)).openOn(map);
    const row=document.querySelector(`.row[data-id="${id}"]`);
    if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
  const q=POS[id]; if(!q) return;
  if(fly) map.flyTo([q.lat,q.lng],Math.max(map.getZoom(),13),{duration:.6});
  if(marks[id]) marks[id].openPopup();
  const row=document.querySelector(`.row[data-id="${id}"]`);
  if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function tally(){
  const c=n=>F.filter(f=>f.properties.coordenada_estado===n).length;
  document.getElementById('tally').innerHTML=
    `<span><b>${c('verificada')}</b> verificadas</span>`+
    `<span><b>${c('provisional')}</b> provisionales</span>`+
    `<span><b>${c('pendiente')}</b> pendientes</span>`+
    `<span><b>27</b> lugares</span>`;
}

buildRail(); drawMarks(true); drawLine(); drawZones(); tally();
const pts=Object.values(POS);
map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[42,42]});
</script>
</body>
</html>
